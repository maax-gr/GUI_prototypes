<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Album Ranking</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f3f4f6;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body { margin: 0; min-width: 320px; }

    button, input { font: inherit; }

    .page { width: min(1600px, 100%); margin: 0 auto; padding: 28px clamp(16px, 4vw, 48px) 48px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(1.7rem, 3vw, 2.4rem); letter-spacing: -0.04em; }
    .intro, .room-label { margin: 7px 0 0; color: #9ca3af; }
    .room-label { max-width: 35vw; overflow-wrap: anywhere; text-align: right; font-size: .85rem; }

    .search-panel { position: relative; z-index: 2; margin-bottom: 24px; }
    .search-row { display: flex; gap: 10px; }
    .search-row input, .room-form input {
      width: 100%; min-width: 0; padding: 12px 14px; border: 1px solid #374151; border-radius: 10px;
      outline: none; background: #1f2937; color: #f9fafb;
    }
    .search-row input:focus, .room-form input:focus { border-color: #a78bfa; box-shadow: 0 0 0 3px #8b5cf633; }
    button { border: 0; border-radius: 9px; padding: 10px 15px; background: #7c3aed; color: white; cursor: pointer; }
    button:hover { background: #6d28d9; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .search-row button { white-space: nowrap; }

    .results {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0; display: grid; gap: 5px;
      max-height: min(65vh, 560px); overflow: auto; padding: 7px; border: 1px solid #374151;
      border-radius: 12px; background: #1f2937; box-shadow: 0 18px 45px #0008;
    }
    .result {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px; text-align: left;
      background: transparent;
    }
    .result:hover { background: #374151; }
    .result img { width: 56px; height: 56px; flex: none; border-radius: 5px; object-fit: cover; background: #374151; }
    .result-copy { min-width: 0; }
    .result-title, .result-artist { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .result-title { color: #f9fafb; font-weight: 650; }
    .result-artist { margin-top: 3px; color: #9ca3af; font-size: .87rem; }

    .notice { min-height: 1.5em; margin: -12px 0 12px; color: #c4b5fd; font-size: .9rem; }
    .notice.error { color: #fca5a5; }
    .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
    .zone { min-height: 330px; padding: 14px; border: 1px solid #374151; border-radius: 14px; background: #18212f; transition: border-color .15s, background .15s; }
    .zone.drag-over { border-color: #a78bfa; background: #27213c; }
    .zone-heading { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin: 0 0 14px; }
    .zone-heading h2 { margin: 0; font-size: 1rem; }
    .count { color: #9ca3af; font-size: .82rem; }
    .cards { display: grid; gap: 12px 10px; min-height: 250px; align-content: start; }
    .cards.size-large { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
    .cards.size-medium { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
    .cards.size-compact { grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 8px 6px; }
    .album-card {
      position: relative; max-width: 112px; min-width: 0; padding: 5px; border: 1px solid transparent; border-radius: 9px;
      cursor: grab; transition: border-color .2s, background .2s, transform .2s;
    }
    .size-medium .album-card { max-width: 84px; }
    .size-compact .album-card { max-width: 66px; }
    .album-card:active { cursor: grabbing; }
    .album-card.dragging { opacity: .35; }
    .album-card.highlight { border-color: #fbbf24; background: #78350f66; transform: scale(1.03); }
    .cover { display: block; width: 100%; aspect-ratio: 1; border-radius: 6px; object-fit: cover; background: #374151; }
    .album-title, .album-artist {
      display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .album-title { margin-top: 7px; font-size: .8rem; font-weight: 650; }
    .album-artist { margin-top: 3px; color: #9ca3af; font-size: .75rem; }
    .remove {
      position: absolute; top: 8px; right: 8px; display: grid; place-items: center; width: 27px; height: 27px;
      padding: 0; border: 1px solid #ffffff44; border-radius: 50%; background: #111827dd; font-size: 1.2rem;
      line-height: 1; opacity: 0; pointer-events: none; transition: opacity .15s;
    }
    .album-card:hover .remove, .album-card:focus-within .remove { opacity: 1; pointer-events: auto; }
    .remove:hover { background: #b91c1c; }
    .empty { color: #6b7280; font-size: .85rem; }
    .status { margin-top: 15px; color: #9ca3af; font-size: .84rem; }
    .status.error { color: #fca5a5; }
    .hidden { display: none !important; }

    .room-gate { width: min(460px, calc(100% - 32px)); margin: 12vh auto; padding: 26px; border: 1px solid #374151; border-radius: 16px; background: #18212f; }
    .room-gate h1 { font-size: 1.7rem; }
    .room-gate p { color: #9ca3af; line-height: 1.5; }
    .room-form { display: flex; gap: 9px; margin-top: 20px; }
    .room-error { min-height: 1.3em; color: #fca5a5 !important; font-size: .88rem; }

    @media (max-width: 900px) {
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .zone { min-height: 270px; }
      .cards { min-height: 190px; }
    }
    @media (max-width: 520px) {
      .page { padding-top: 20px; }
      header { display: block; }
      .room-label { max-width: 100%; text-align: left; }
      .board { grid-template-columns: 1fr; }
      .zone { min-height: 220px; }
      .cards { min-height: 140px; }
      .search-row { gap: 6px; }
      .search-row button { padding-inline: 11px; }
    }
  </style>
</head>
<body>
  <main id="room-gate" class="room-gate hidden">
    <h1>Join an album board</h1>
    <p>Enter the private room code shared by the board owner. Treat it like a password: anyone with the code can view and change that board.</p>
    <form id="room-form" class="room-form">
      <input id="room-code-input" autocomplete="off" spellcheck="false" aria-label="Room code" placeholder="Room code" required>
      <button type="submit">Join room</button>
    </form>
    <p id="room-error" class="room-error" role="alert"></p>
  </main>

  <main id="app" class="page hidden">
    <header>
      <div>
        <h1>Album Ranking</h1>
        <p class="intro">Search, add, then drag albums to rank them together.</p>
      </div>
      <p class="room-label">Room <span id="room-name"></span></p>
    </header>

    <section class="search-panel" aria-label="Search albums">
      <form id="search-form" class="search-row">
        <input id="search-input" type="search" autocomplete="off" placeholder="Search artist and album (e.g. Pink Floyd Dark Side of the Moon)…" aria-label="Search artist or album">
        <button id="search-button" type="submit">Search</button>
      </form>
      <div id="results" class="results hidden" role="listbox" aria-label="Album search results"></div>
    </section>
    <p id="notice" class="notice" aria-live="polite"></p>
    <section id="board" class="board" aria-label="Album ranking board"></section>
    <p id="connection-status" class="status" role="status">Connecting to the shared board…</p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getDatabase,
      onValue,
      ref,
      runTransaction,
      update
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    // Firebase web configuration. Web API keys identify the project; Realtime Database rules protect its data.
    const firebaseConfig = {
      apiKey: "AIzaSyATsWeVl67OrI_Sg7g6_Bc-mV5IMv4rV_I",
      authDomain: "album-ranking-collab.firebaseapp.com",
      databaseURL: "https://album-ranking-collab-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "album-ranking-collab",
      storageBucket: "album-ranking-collab.firebasestorage.app",
      messagingSenderId: "204272796573",
      appId: "1:204272796573:web:a11e1a69579655f7d1a574"
    };

    const zones = [
      { id: "top20", label: "Top 20" },
      { id: "20to40", label: "20–40" },
      { id: "40to60", label: "40–60" },
      { id: "unsorted", label: "Unsorted" }
    ];
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const gate = document.querySelector("#room-gate");
    const roomForm = document.querySelector("#room-form");
    const roomInput = document.querySelector("#room-code-input");
    const roomError = document.querySelector("#room-error");
    const appElement = document.querySelector("#app");
    const board = document.querySelector("#board");
    const results = document.querySelector("#results");
    const searchForm = document.querySelector("#search-form");
    const searchInput = document.querySelector("#search-input");
    const searchButton = document.querySelector("#search-button");
    const notice = document.querySelector("#notice");
    const status = document.querySelector("#connection-status");
    const roomName = document.querySelector("#room-name");

    let roomCode = "";
    let albums = {};
    let draggedId = "";
    let searchTimer;
    let searchRequest;
    let noticeTimer;
    let unsubscribe;

    function showNotice(message, isError = false) {
      window.clearTimeout(noticeTimer);
      notice.textContent = message;
      notice.classList.toggle("error", isError);
      noticeTimer = window.setTimeout(() => { notice.textContent = ""; }, 4500);
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function validRoomCode(value) {
      return /^[A-Za-z0-9_-]{22,128}$/.test(value);
    }

    function startRoom(value) {
      const code = value.trim();
      if (!validRoomCode(code)) {
        roomError.textContent = "Use a 22–128 character room code with letters, numbers, hyphens or underscores. For privacy, use at least 128 bits of randomness.";
        return;
      }
      roomCode = code;
      history.replaceState(null, "", `#${encodeURIComponent(code)}`);
      gate.classList.add("hidden");
      appElement.classList.remove("hidden");
      roomName.textContent = code;
      roomName.title = code;
      subscribeToRoom();
    }

    function subscribeToRoom() {
      const albumsRef = ref(database, `rooms/${roomCode}/albums`);
      unsubscribe = onValue(albumsRef, snapshot => {
        albums = snapshot.val() || {};
        renderBoard();
        setStatus(`Live · ${Object.keys(albums).length} album${Object.keys(albums).length === 1 ? "" : "s"}`);
      }, error => {
        setStatus(`Could not read this room: ${error.message}`, true);
      });
    }

    function sortedAlbums(zoneId) {
      return Object.entries(albums)
        .filter(([, album]) => album && album.zone === zoneId)
        .sort((a, b) => Number(a[1].order) - Number(b[1].order) || a[0].localeCompare(b[0]));
    }

    function renderBoard(highlightId = "") {
      board.replaceChildren();
      zones.forEach(zone => {
        const zoneElement = document.createElement("section");
        zoneElement.className = "zone";
        zoneElement.dataset.zone = zone.id;
        const entries = sortedAlbums(zone.id);
        const heading = document.createElement("div");
        heading.className = "zone-heading";
        const title = document.createElement("h2");
        title.textContent = zone.label;
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = String(entries.length);
        heading.append(title, count);
        const cards = document.createElement("div");
        cards.className = "cards";
        cards.classList.add(entries.length > 28 ? "size-compact" : entries.length > 12 ? "size-medium" : "size-large");
        cards.dataset.zone = zone.id;
        if (!entries.length) {
          const empty = document.createElement("span");
          empty.className = "empty";
          empty.textContent = "Drop albums here";
          cards.append(empty);
        }
        entries.forEach(([id, album]) => cards.append(createCard(id, album, id === highlightId)));
        zoneElement.append(heading, cards);
        zoneElement.addEventListener("dragover", event => {
          event.preventDefault();
          zoneElement.classList.add("drag-over");
        });
        zoneElement.addEventListener("dragleave", event => {
          if (!zoneElement.contains(event.relatedTarget)) zoneElement.classList.remove("drag-over");
        });
        zoneElement.addEventListener("drop", event => {
          event.preventDefault();
          zoneElement.classList.remove("drag-over");
          const card = event.target.closest(".album-card");
          const targetId = card?.dataset.albumId || "";
          const after = card ? event.clientX > card.getBoundingClientRect().left + card.getBoundingClientRect().width / 2 : true;
          moveAlbum(draggedId, zone.id, targetId, after);
        });
        board.append(zoneElement);
      });
    }

    function createCard(id, album, highlighted) {
      const card = document.createElement("article");
      card.className = `album-card${highlighted ? " highlight" : ""}`;
      card.dataset.albumId = id;
      card.draggable = true;
      card.addEventListener("dragstart", event => {
        draggedId = id;
        card.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", id);
      });
      card.addEventListener("dragend", () => {
        draggedId = "";
        card.classList.remove("dragging");
        document.querySelectorAll(".zone.drag-over").forEach(element => element.classList.remove("drag-over"));
      });

      const image = document.createElement("img");
      image.className = "cover";
      image.src = album.coverUrl;
      image.alt = `Cover for ${album.title}`;
      image.loading = "lazy";
      image.onerror = () => { image.removeAttribute("src"); };
      const title = document.createElement("span");
      title.className = "album-title";
      title.textContent = album.title;
      title.title = album.title;
      const artist = document.createElement("span");
      artist.className = "album-artist";
      artist.textContent = album.artist;
      artist.title = album.artist;
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "remove";
      remove.textContent = "×";
      remove.title = `Remove ${album.title}`;
      remove.setAttribute("aria-label", `Remove ${album.title}`);
      remove.addEventListener("click", async event => {
        event.stopPropagation();
        if (!window.confirm(`Remove “${album.title}” from this board for everyone?`)) return;
        try {
          await update(ref(database, `rooms/${roomCode}/albums`), { [id]: null });
        } catch (error) {
          showNotice(`Could not remove album: ${error.message}`, true);
        }
      });
      card.append(image, title, artist, remove);
      return card;
    }

    async function moveAlbum(id, zoneId, targetId, after) {
      if (!id || !albums[id] || !zones.some(zone => zone.id === zoneId)) return;
      if (targetId === id) return;
      const inZone = sortedAlbums(zoneId).filter(([albumId]) => albumId !== id);
      let insertionIndex = inZone.length;
      if (targetId && targetId !== id) {
        const targetIndex = inZone.findIndex(([albumId]) => albumId === targetId);
        if (targetIndex >= 0) insertionIndex = targetIndex + (after ? 1 : 0);
      }
      const previous = inZone[insertionIndex - 1]?.[1];
      const next = inZone[insertionIndex]?.[1];
      const previousOrder = previous ? Number(previous.order) : null;
      const nextOrder = next ? Number(next.order) : null;
      let order;
      if (previousOrder === null && nextOrder === null) order = 1;
      else if (previousOrder === null) order = nextOrder - 1;
      else if (nextOrder === null) order = previousOrder + 1;
      else order = previousOrder + (nextOrder - previousOrder) / 2;

      const closeNeighbors = previousOrder !== null && nextOrder !== null &&
        Math.abs(nextOrder - previousOrder) <= Number.EPSILON * Math.max(Math.abs(previousOrder), Math.abs(nextOrder), 1) * 4;
      try {
        if (closeNeighbors) {
          const ordered = [...inZone];
          ordered.splice(insertionIndex, 0, [id, albums[id]]);
          const changes = {};
          ordered.forEach(([albumId], index) => {
            changes[`${albumId}/order`] = index + 1;
          });
          changes[`${id}/zone`] = zoneId;
          await update(ref(database, `rooms/${roomCode}/albums`), changes);
        } else {
          await update(ref(database, `rooms/${roomCode}/albums/${id}`), { zone: zoneId, order });
        }
      } catch (error) {
        showNotice(`Could not move album: ${error.message}`, true);
      }
    }

    function artworkSize(url, size) {
      return url.replace(/100x100(?=bb)/g, `${size}x${size}`).replace(/100x100(?!bb)/g, `${size}x${size}`);
    }

    async function fetchItunesResults(query, entity, signal) {
      const endpoint = new URL("https://itunes.apple.com/search");
      endpoint.search = new URLSearchParams({ term: query, media: "music", entity, limit: "10" });
      const response = await fetch(endpoint, { signal });
      if (!response.ok) throw new Error(`iTunes ${entity} search returned HTTP ${response.status}`);
      const data = await response.json();
      return data.results || [];
    }

    function relevanceScore(album, query) {
      const title = album.collectionName.toLocaleLowerCase();
      const artist = album.artistName.toLocaleLowerCase();
      const normalizedQuery = query.toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();
      const words = normalizedQuery.split(/\s+/).filter(Boolean);
      const wordScore = words.reduce((score, word) =>
        score + (title.includes(word) ? 2 : 0) + (artist.includes(word) ? 1 : 0), 0);
      return wordScore + (artist && normalizedQuery.includes(artist) ? 4 : 0);
    }

    async function searchAlbums(query) {
      if (searchRequest) searchRequest.abort();
      searchRequest = new AbortController();
      const request = searchRequest;
      try {
        const responses = await Promise.allSettled([
          fetchItunesResults(query, "album", request.signal),
          fetchItunesResults(query, "song", request.signal)
        ]);
        if (request !== searchRequest) return;
        const available = responses.filter(result => result.status === "fulfilled");
        if (!available.length) {
          throw new Error(responses.map(result => result.reason.message).join("; "));
        }
        const albumsById = new Map();
        available.forEach(response => {
          response.value.forEach(item => {
            if (item.collectionId && item.collectionName && item.artistName && item.artworkUrl100) {
              const id = String(item.collectionId);
              if (!albumsById.has(id)) albumsById.set(id, item);
            }
          });
        });
        const rankedAlbums = [...albumsById.values()]
          .sort((a, b) => relevanceScore(b, query) - relevanceScore(a, query))
          .slice(0, 10);
        renderResults(rankedAlbums);
      } catch (error) {
        if (!request.signal.aborted) {
          results.classList.add("hidden");
          showNotice(`Album search failed: ${error.message}`, true);
        }
      }
    }

    function renderResults(items) {
      results.replaceChildren();
      if (!items.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No albums found.";
        results.append(empty);
      } else {
        items.forEach(item => {
          if (!item.collectionId || !item.collectionName || !item.artistName || !item.artworkUrl100) return;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "result";
          button.setAttribute("role", "option");
          const image = document.createElement("img");
          image.src = artworkSize(item.artworkUrl100, 100);
          image.alt = "";
          const copy = document.createElement("span");
          copy.className = "result-copy";
          const title = document.createElement("span");
          title.className = "result-title";
          title.textContent = item.collectionName;
          const artist = document.createElement("span");
          artist.className = "result-artist";
          const year = item.releaseDate ? ` · ${item.releaseDate.slice(0, 4)}` : "";
          artist.textContent = `${item.artistName}${year}`;
          copy.append(title, artist);
          button.append(image, copy);
          button.addEventListener("click", () => addAlbum(item));
          results.append(button);
        });
      }
      results.classList.remove("hidden");
    }

    async function addAlbum(item) {
      const id = String(item.collectionId);
      const albumRef = ref(database, `rooms/${roomCode}/albums/${id}`);
      const album = {
        title: item.collectionName,
        artist: item.artistName,
        coverUrl: artworkSize(item.artworkUrl100, 300),
        zone: "unsorted",
        order: Math.max(0, ...sortedAlbums("unsorted").map(([, current]) => Number(current.order) || 0)) + 1,
        addedAt: Date.now()
      };
      const year = Number(item.releaseDate?.slice(0, 4));
      if (Number.isInteger(year) && year > 0) album.year = year;
      try {
        const result = await runTransaction(albumRef, current => current || album, { applyLocally: false });
        results.classList.add("hidden");
        searchInput.value = "";
        if (result.committed) {
          showNotice(`Added “${item.collectionName}” to Unsorted.`);
        } else {
          showNotice(`“${item.collectionName}” is already on the board.`);
          renderBoard(id);
          window.setTimeout(renderBoard, 2200);
          document.querySelector(`[data-album-id="${CSS.escape(id)}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      } catch (error) {
        showNotice(`Could not add album: ${error.message}`, true);
      }
    }

    searchInput.addEventListener("input", () => {
      window.clearTimeout(searchTimer);
      const query = searchInput.value.trim();
      if (query.length < 2) {
        if (searchRequest) searchRequest.abort();
        results.classList.add("hidden");
        return;
      }
      searchTimer = window.setTimeout(() => searchAlbums(query), 400);
    });
    searchForm.addEventListener("submit", event => {
      event.preventDefault();
      window.clearTimeout(searchTimer);
      const query = searchInput.value.trim();
      if (query.length >= 2) searchAlbums(query);
    });
    searchButton.addEventListener("click", () => {
      searchButton.disabled = true;
      window.setTimeout(() => { searchButton.disabled = false; }, 500);
    });
    document.addEventListener("click", event => {
      if (!event.target.closest(".search-panel")) results.classList.add("hidden");
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") results.classList.add("hidden");
    });
    roomForm.addEventListener("submit", event => {
      event.preventDefault();
      startRoom(roomInput.value);
    });
    window.addEventListener("beforeunload", () => unsubscribe?.());

    let initialCode = "";
    try {
      initialCode = decodeURIComponent(location.hash.slice(1));
    } catch (error) {
      roomError.textContent = `The room code in this link is malformed: ${error.message}`;
    }
    if (initialCode && validRoomCode(initialCode)) {
      startRoom(initialCode);
    } else {
      gate.classList.remove("hidden");
      if (initialCode) {
        roomInput.value = initialCode;
        roomError.textContent = "The room code in this link is invalid. Use a 22–128 character code.";
      }
    }
  </script>
</body>
</html>
